<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Jimmy Voice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%;
    background: #0d0d0d; color: #e0e0e0;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    overflow: hidden; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  .container {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; padding: 1.5rem; gap: 1.5rem;
  }
  .status-bar {
    font-size: 0.75rem; color: #666; text-align: center;
  }
  .status-bar .dot { display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.connected { background: #4caf50; }
  .dot.disconnected { background: #f44336; }

  #ptt {
    width: 180px; height: 180px; border-radius: 50%;
    border: 4px solid #7b68ee; background: rgba(123,104,238,0.08);
    color: #7b68ee; font-family: inherit; font-size: 0.85rem;
    font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  #ptt:active, #ptt.recording {
    background: rgba(244,67,54,0.15); border-color: #f44336;
    color: #f44336; transform: scale(1.08);
  }
  #ptt.processing {
    background: rgba(123,104,238,0.12); border-color: #7b68ee;
    color: #7b68ee; animation: pulse 1.2s infinite;
  }
  #ptt.playing {
    background: rgba(76,175,80,0.12); border-color: #4caf50;
    color: #4caf50; animation: pulse 0.8s infinite;
  }
  #ptt:disabled { opacity: 0.5; cursor: not-allowed; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .transcript-area {
    width: 100%; max-width: 400px; flex: 0 1 auto;
    overflow-y: auto; text-align: center;
    display: flex; flex-direction: column; gap: 0.75rem;
    max-height: 40vh;
  }
  .label { font-size: 0.65rem; color: #555; text-transform: uppercase;
    letter-spacing: 0.1em; }
  .you-said { font-size: 0.9rem; color: #999; }
  .jimmy-said { font-size: 0.95rem; color: #7b68ee; white-space: pre-wrap;
    word-break: break-word; }
  .error-msg { font-size: 0.8rem; color: #f44336; }
</style>
</head>
<body>
<div class="container">
  <div class="status-bar">
    <span class="dot disconnected" id="dot"></span>
    <span id="conn-label">connecting...</span>
  </div>

  <button id="ptt">HOLD TO<br>TALK</button>

  <div class="transcript-area">
    <div id="you-block" style="display:none">
      <div class="label">you said</div>
      <div class="you-said" id="you-text"></div>
    </div>
    <div id="jimmy-block" style="display:none">
      <div class="label">jimmy</div>
      <div class="jimmy-said" id="jimmy-text"></div>
    </div>
    <div id="error-block" style="display:none">
      <div class="error-msg" id="error-text"></div>
    </div>
  </div>
</div>

<script>
const ptt = document.getElementById('ptt');
const dot = document.getElementById('dot');
const connLabel = document.getElementById('conn-label');
const youBlock = document.getElementById('you-block');
const youText = document.getElementById('you-text');
const jimmyBlock = document.getElementById('jimmy-block');
const jimmyText = document.getElementById('jimmy-text');
const errorBlock = document.getElementById('error-block');
const errorText = document.getElementById('error-text');

let ws = null;
let recorder = null;
let recording = false;
let state = 'ready'; // ready | recording | processing | playing

function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const base = location.pathname.replace(//talk.*/, ''); return proto + '//' + location.host + base + '/ws';
}

function connect() {
  ws = new WebSocket(wsUrl());
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    dot.className = 'dot connected';
    connLabel.textContent = 'connected';
    setState('ready');
  };

  ws.onclose = () => {
    dot.className = 'dot disconnected';
    connLabel.textContent = 'reconnecting...';
    setState('ready');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    switch (msg.type) {
      case 'state':
        setState(msg.data);
        break;
      case 'transcript':
        youBlock.style.display = '';
        youText.textContent = msg.data;
        break;
      case 'response':
        jimmyBlock.style.display = '';
        jimmyText.textContent = msg.data;
        break;
      case 'audio_response':
        playAudio(msg.data);
        break;
      case 'error':
        errorBlock.style.display = '';
        errorText.textContent = msg.data;
        break;
    }
  };
}

function setState(s) {
  state = s;
  ptt.className = s === 'ready' ? '' : s;
  ptt.disabled = (s === 'processing' || s === 'playing');
  const labels = {
    ready: 'HOLD TO\nTALK',
    recording: '\u{1F534} RECORDING',
    processing: '\u2699\uFE0F PROCESSING',
    playing: '\u{1F50A} PLAYING',
  };
  ptt.textContent = labels[s] || s;
}

function playAudio(dataUri) {
  const audio = new Audio(dataUri);
  audio.onended = () => {
    if (state === 'playing') setState('ready');
  };
  audio.onerror = () => {
    if (state === 'playing') setState('ready');
  };
  audio.play().catch(() => setState('ready'));
}

// --- PTT touch/mouse handling ---
async function startRecording() {
  if (state !== 'ready' || !ws || ws.readyState !== WebSocket.OPEN) return;
  errorBlock.style.display = 'none';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recording = true;
    setState('recording');
    ws.send(JSON.stringify({ type: 'audio_start' }));

    recorder = new MediaRecorder(stream, { mimeType: getMimeType() });
    recorder.ondataavailable = (e) => {
      if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
        e.data.arrayBuffer().then(buf => ws.send(buf));
      }
    };
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
    };
    recorder.start(250); // send chunks every 250ms
  } catch (err) {
    errorBlock.style.display = '';
    errorText.textContent = 'Mic access denied: ' + err.message;
    setState('ready');
  }
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  if (recorder && recorder.state !== 'inactive') {
    recorder.stop();
  }
  recorder = null;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'audio_end' }));
  }
}

function getMimeType() {
  if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) return 'audio/webm;codecs=opus';
  if (MediaRecorder.isTypeSupported('audio/webm')) return 'audio/webm';
  if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) return 'audio/ogg;codecs=opus';
  return '';
}

// Touch events
ptt.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
ptt.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
ptt.addEventListener('touchcancel', (e) => { e.preventDefault(); stopRecording(); });
// Mouse fallback
ptt.addEventListener('mousedown', (e) => { e.preventDefault(); startRecording(); });
ptt.addEventListener('mouseup', (e) => { e.preventDefault(); stopRecording(); });
ptt.addEventListener('mouseleave', () => { if (recording) stopRecording(); });

// Prevent context menu on long press
ptt.addEventListener('contextmenu', (e) => e.preventDefault());

connect();
</script>
</body>
</html>
